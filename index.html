<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Basic Principle · Piezoelectric Effect</title><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#fff;overflow:hidden;font-family:"Segoe UI",Arial,Helvetica,sans-serif;font-weight:800;color:#12263F}
#s{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;background:#fff}
#t{position:absolute;left:80px;top:34px;font-size:46px;letter-spacing:1px;line-height:1.1}#t span{color:#E0662B}
#d{position:absolute;left:40px;top:120px;width:1040px;height:720px}
#l{position:absolute;left:1130px;top:120px;width:730px}
.r{display:flex;align-items:center;gap:18px;padding:10px 16px;margin-bottom:12px;box-shadow:0 3px 10px rgba(18,38,63,.07);border-radius:18px;font-size:28px;white-space:nowrap;color:#9AA6B6;border-left:12px solid transparent}
.r b{flex:none;width:46px;height:46px;border-radius:50%;background:#DDE4EE;color:#fff;display:flex;align-items:center;justify-content:center;font-size:26px}
.r.on{background:#FFF1E8;color:#12263F;border-left-color:#E0662B}.r.on b{background:#E0662B}
.r.dn{color:#12263F}.r.dn b{background:#12263F}
#o{position:absolute;left:1130px;top:600px;width:730px;height:232px;background:#F4F7FB;border-radius:22px;padding:16px 28px;font-size:30px;line-height:1.4;box-shadow:0 4px 14px rgba(18,38,63,.12)}
#o small{display:block;font-size:21px;color:#6B778A;line-height:1.2}
#c{position:absolute;left:0;top:850px;width:1920px;height:84px;background:#12263F;color:#fff;font-size:36px;display:flex;align-items:center;justify-content:center}
#k{position:absolute;left:80px;top:976px;font-size:28px;display:flex;align-items:center;gap:22px}
#k input{width:620px;height:14px;accent-color:#E0662B}
.bt{position:absolute;top:955px;height:78px;padding:0 28px;font:800 30px "Segoe UI",Arial;border:0;border-radius:16px;background:#E0662B;color:#fff;cursor:pointer}
</style></head><body><div id="s">
<div id="t">BASIC PRINCIPLE: <span>PIEZOELECTRIC EFFECT</span></div>
<svg id="d" viewBox="0 0 1040 720"></svg><div id="l"></div><div id="o"></div><div id="c"></div>
<div id="k">DRAG THE FORCE <input id="sl" type="range" min="0" max="100" value="0"></div>
<button class="bt" id="bb" style="left:1130px;background:#12263F">◀ BACK</button>
<button class="bt" id="bn" style="left:1370px">NEXT ▶</button>
<button class="bt" id="ba" style="left:1620px;background:#1F6FD1">AUTO</button>
</div>
<script>
const $=i=>document.getElementById(i),O='#E0662B',B='#1F6FD1',N='#12263F';
const ROW=['NO FORCE: balanced charges','FORCE ON: atoms are pushed','+/− CENTRES move apart: DIPOLE','OPPOSITE CHARGES on the faces','FORCE OFF: back to neutral'];
const CAP=['Crystal is NEUTRAL: + and − charge centres sit together','Apply FORCE: the crystal is squeezed, atoms shift','Centres move apart → a DIPOLE forms inside','Dipoles add up → + on top face, − on bottom face','Remove force → atoms return, charge disappears'];
const TF=[0,1,1,1,0];let st=0,f=0,tf=0,au=0,tm=0,last=performance.now();
$('l').innerHTML=ROW.map((x,i)=>`<div class="r" id="r${i}"><b>${i+1}</b><span>${x}</span></div>`).join('');
const mix=(a,b,t)=>'#'+[1,3,5].map(i=>Math.round(parseInt(a.substr(i,2),16)*(1-t)+parseInt(b.substr(i,2),16)*t).toString(16).padStart(2,'0')).join('');
function go(n){st=(n%5+5)%5;tf=TF[st];tm=0;$('sl').value=tf*100;ROW.forEach((_,i)=>$('r'+i).className='r'+(i==st?' on':i<st?' dn':''));$('c').textContent=CAP[st]}
function draw(){
 const cx=520,cy=395,R=195,D=90*f,p=.5+.5*Math.sin(tm*7),I=[];
 for(let k=0;k<6;k++){const a=-Math.PI/2+k*Math.PI/3;I.push([cx+R*Math.cos(a),cy+R*Math.sin(a)+(k?0:D),k%2==1])}
 const av=q=>{const a=I.filter(v=>v[2]==q);return[a.reduce((s,v)=>s+v[0],0)/3,a.reduce((s,v)=>s+v[1],0)/3]},cp=av(true),cn=av(false),pt=cy-R-82+D,pb=cy+R+38,X=[0,1,2,3,4,5].map(i=>305+i*88),ow=Math.min(1,f*3),hl=st==3&&f>.8,gl=hl?'#FFB400':N,gw=hl?6+6*p:5;
 const ring=(q,c)=>`<circle cx="${q[0]}" cy="${q[1]}" r="${15+(st==2?8*p:0)}" fill="#fff" stroke="${c}" stroke-width="7"/>`;
 let s=`<defs><filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#12263F" flood-opacity=".22"/></filter></defs><rect x="8" y="0" width="1024" height="720" rx="28" fill="#F7F9FC"/><rect x="240" y="${pb+52}" width="560" height="30" rx="6" fill="${N}"/><text x="520" y="${pb+75}" font-size="22" fill="#fff" text-anchor="middle">FIXED SUPPORT</text>`;
 s+=`<rect x="260" y="${pb}" width="520" height="44" rx="8" fill="${mix('#C9D2DE',B,f)}" stroke="${gl}" stroke-width="${gw}"/>`+X.map(x=>`<text x="${x}" y="${pb+34}" font-size="34" fill="#fff" text-anchor="middle" opacity="${f}">−</text>`).join('');
 s+=`<rect x="260" y="${pt}" width="520" height="44" rx="8" fill="${mix('#C9D2DE',O,f)}" stroke="${gl}" stroke-width="${gw}"/>`+X.map(x=>`<text x="${x}" y="${pt+34}" font-size="34" fill="#fff" text-anchor="middle" opacity="${f}">+</text>`).join('');
 s+=`<polygon points="${I.map(v=>v[0]+','+v[1]).join(' ')}" fill="#EEF3FA" stroke="${N}" stroke-width="6" stroke-linejoin="round"/>`;
 s+=I.map(v=>`<circle cx="${v[0]}" cy="${v[1]}" r="30" filter="url(#sh)" fill="${v[2]?O:B}"/><text x="${v[0]}" y="${v[1]+15}" font-size="38" fill="#fff" text-anchor="middle">${v[2]?'+':'−'}</text>`).join('')+ring(cn,B)+ring(cp,O);
 s+=`<g opacity="${ow}"><text x="50" y="70" font-size="36" fill="${O}">FORCE (F)</text>`+[370,520,670].map(x=>`<path d="M${x} ${pt-95}V${pt-48}" stroke="${O}" stroke-width="20"/><path d="M${x-36} ${pt-50}L${x} ${pt-8}L${x+36} ${pt-50}Z" fill="${O}"/>`).join('')+`</g>`;
 const sp=130*f,yP=395-sp/2-40,yM=395+sp/2+40;
 s+=`<g opacity="${Math.min(1,f*2.5)}"><path d="M915 ${yM}V${yP}" stroke="${N}" stroke-width="8"/><circle cx="915" cy="${yP}" r="30" fill="${O}"/><text x="915" y="${yP+15}" font-size="38" fill="#fff" text-anchor="middle">+</text><circle cx="915" cy="${yM}" r="30" fill="${B}"/><text x="915" y="${yM+15}" font-size="38" fill="#fff" text-anchor="middle">−</text><text x="915" y="590" font-size="30" fill="${N}" text-anchor="middle">DIPOLE</text></g>`;
 s+=`<circle cx="815" cy="45" r="14" fill="#fff" stroke="${O}" stroke-width="7"/><text x="845" y="56" font-size="25" fill="${N}">+ centre</text><circle cx="815" cy="95" r="14" fill="#fff" stroke="${B}" stroke-width="7"/><text x="845" y="106" font-size="25" fill="${N}">− centre</text><text x="520" y="715" font-size="0"></text>`;
 $('d').innerHTML=s;
 const F=500*f,Q=2.3*F,V=Q/100;
 $('o').innerHTML=`Force <span style="color:${O}">F = ${F.toFixed(0)} N</span><br>Charge <span style="color:${O}">Q = d × F = ${Q.toFixed(0)} pC</span><br>Voltage <span style="color:${B}">V = Q ÷ C = ${V.toFixed(1)} V</span><small>Quartz: d = 2.3 pC/N, C = 100 pF · atom movement drawn exaggerated</small>`}
function loop(n){const d=Math.min(.05,(n-last)/1000);last=n;tm+=d;f+=Math.sign(tf-f)*Math.min(Math.abs(tf-f),d*1.1);if(au&&tm>4.5)go(st+1);draw();requestAnimationFrame(loop)}
$('sl').oninput=e=>{tf=e.target.value/100};
$('bb').onclick=()=>go(st-1);$('bn').onclick=()=>go(st+1);
$('ba').onclick=()=>{au^=1;$('ba').textContent=au?'AUTO ✓':'AUTO'};
onkeydown=e=>{if(e.key=='ArrowRight'||e.key==' ')go(st+1);else if(e.key=='ArrowLeft')go(st-1);else if(e.key=='f'||e.key=='F')document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()};
function fit(){const k=Math.min(innerWidth/1920,innerHeight/1080),s=$('s').style;s.transform=`scale(${k})`;s.left=(innerWidth-1920*k)/2+'px';s.top=(innerHeight-1080*k)/2+'px'}
onresize=fit;fit();go(0);requestAnimationFrame(loop);
</script></body></html>
